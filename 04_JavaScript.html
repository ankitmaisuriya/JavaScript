<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="p1">Click the button to see a message:</p>
    <button type="button" onclick="document.getElementById('p1').style.display = 'none'"> Hide me</button>
    <button type="button" onclick="document.getElementById('p1').style.display = 'block'">Show me</button>
</body>

</html>
