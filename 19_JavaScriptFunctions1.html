<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JavaScript Functions</h1>
    <p>Functions are the building blocks of JavaScript.</p>
    <button onclick='document.getElementById("demo").innerHTML = myFunction(5, 10)'>Click me</button>
    <p id="demo"></p>
    <script>
        function myFunction(a, b) {
            return a * b;
        }
    </script>
</body> 

</html>
