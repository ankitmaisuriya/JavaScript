<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h2>What Can JavaScript Do?</h2>

    <p>JavaScript can change HTML attribute values.</p>

    <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>
    <button type="button"
        onclick='document.getElementById("bulb").src = "https://www.w3schools.com/js/pic_bulbon.gif" '>Turn on the
        Light</button>
    <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" style="width:100px;height:180px;">

    <button type="button"
        onclick="document.getElementById('bulb').src = 'https://www.w3schools.com/js/pic_bulboff.gif'">Turn off the
        Light</button>


</body>

</html>
