<!DOCTYPE html>
<html>

<body>

    <h1>JavaScript Variables</h1>

    <p>In this example, price1, price2, and total are variables.</p>

    <p id="demo"></p>

    <script>
        const price1 = 5; // Using const for price1
        const price2 = 6; // Using const for price2
        let total = price1 + price2; // Using let for total
        // Using let for total allows us to reassign it later if needed
        // If we need to change the value of total later, we can do so
        // For example:
        document.getElementById("demo").innerHTML =
            "The total is: " + total;
    </script>

</body>

</html>
