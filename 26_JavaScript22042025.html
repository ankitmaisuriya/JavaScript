<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #0960f7;
            font-size: 2.5em;
        }

        p {
            text-align: center;
            color: #e3105a;
            font-size: 1.2em;
            line-height: 1.5;
        }

        button {
            text-align: center;
            display: block;
        }
    </style>
</head>

<body>
    <h1>Java Script Demo</h1>
    <p>JavaScript is a programming language that allows you to implement complex features on web pages.</p>
    <p id="demo">It is a versatile language that can be used for both front-end and back-end development.</p>
    <p id="dem">JavaScript is an essential part of web development, along with HTML and CSS.</p>
    <button onclick="calculate(100,200)">Click Me!</button>
    <br>
    <button onclick="arrayItem()">Select Fruit!</button>
    <br>
    <button onclick="objectDemo()">Object Demo!</button>
    <script>
        document.getElementById("demo").innerHTML = "Changed the value of the paragraph using JavaScript!"

        function calculate(x, y) {
            var x = 20;
            var y = 40;
            var z = x + y;

            document.getElementById("demo").innerHTML = "The sum of x and y is: " + z;
        }

        function arrayItem() {

            const fruits = ["Apple", "Banana", "Cherry"];
            fruits.push("Orange"); // Add an item to the end of the array
            fruits.pop(); // Remove the last item from the array
            fruits.shift(); // Remove the first item from the array
            fruits.unshift("Mango"); // Add an item to the beginning of the array
            fruits.splice(1, 0, "Lemon", "Kiwi"); // Add two items at index 1
            fruits.splice(0, 1); // Remove the first item from the array
            fruits.splice(0, 1, "Pineapple"); // Replace the first item with "Pineapple"
            fruits.splice(0, 1, "Grapes", "Peach"); // Replace the first item with "Grapes" and add "Peach"
            fruits.sort(); // Sort the array alphabetically
            fruits.reverse(); // Reverse the order of the array
            document.getElementById("demo").innerHTML = fruits;
        }

        function objectDemo() {

            const person = {
                firstName: 'John',
                lastName: 'Doe',
                age: 30
            };

            person.age = 35;

            document.getElementById("dem").innerHTML = person.age;
            document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old.";
        }
    </script>
</body>

</html>
